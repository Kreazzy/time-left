<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waqar & Sahar - Our Journey to Forever</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sahar-pink: #BF40BF;
            --waqar-blue: #00BFFF;
            --gold-accent: #FFD700;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        #video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.3), rgba(0, 191, 255, 0.3));
            z-index: -1;
            backdrop-filter: blur(2px);
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 50px 40px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hearts-decoration {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .names-container {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
        }

        .names {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 10vw, 5.5rem);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: clamp(10px, 3vw, 25px);
        }

        .name {
            display: inline-block;
            text-shadow: 
                0 0 20px rgba(0, 0, 0, 0.8),
                0 0 40px currentColor;
            animation: glow 2s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 10px currentColor);
            }
            to {
                filter: drop-shadow(0 0 25px currentColor);
            }
        }

        .waqar {
            color: var(--waqar-blue);
        }

        .sahar {
            color: var(--sahar-pink);
        }

        .ampersand {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 8vw, 4.5rem);
            color: var(--gold-accent);
            text-shadow: 0 0 20px var(--gold-accent);
        }

        .subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
            font-weight: 300;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.95;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 45px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .time-box {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .time-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--sahar-pink), var(--waqar-blue));
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .time-box:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .time-box:hover::before {
            transform: scaleX(1);
        }

        .time-value {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            color: var(--text-light);
            display: block;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .time-label {
            font-size: clamp(0.7rem, 1.5vw, 0.95rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.9;
            color: var(--gold-accent);
        }

        .quote-section {
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.2));
            border-radius: 25px;
            padding: clamp(25px, 5vw, 40px);
            text-align: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .quote-icon {
            font-size: 4rem;
            color: var(--sahar-pink);
            opacity: 0.2;
            position: absolute;
            top: 10px;
            left: 20px;
            font-family: Georgia, serif;
            line-height: 1;
        }

        .quote-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.1rem, 2.8vw, 1.6rem);
            font-style: italic;
            line-height: 1.8;
            position: relative;
            z-index: 1;
            font-weight: 400;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }

            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .time-box {
                padding: 20px 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="video-bg">
        <source src="https://cdn.pixabay.com/video/2023/03/01/152798-803733100_large.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="container">
        <div class="hearts-decoration">💕 ✨ 💕</div>
        
        <div class="names-container">
            <div class="names">
                <span class="name waqar">WAQAR</span>
                <span class="ampersand">&</span>
                <span class="name sahar">SAHAR</span>
            </div>
        </div>

        <p class="subtitle">Counting Every Moment Until Forever</p>

        <div class="countdown-grid">
            <div class="time-box">
                <span class="time-value" id="days">0</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="hours">0</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="minutes">0</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="seconds">0</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>

        <div class="quote-section">
            <span class="quote-icon">"</span>
            <p class="quote-text" id="quote"></p>
            <span class="quote-icon">"</span>
            
        </div>
    </div>

    <script>
        // Wedding date: March 22, 2026
        const weddingDate = new Date('2026-03-22T00:00:00').getTime();

        // Romantic quotes collection
        const quotes = [
            "In you, I've found the love of my life and my closest, truest friend.",
            "Every love story is beautiful, but ours is my favorite.",
            "I choose you. And I'll choose you over and over. Without pause, without a doubt, in a heartbeat. I'll keep choosing you.",
            "You are my today and all of my tomorrows.",
            "I love you not only for what you are, but for what I am when I am with you.",
            "Together is a wonderful place to be.",
            "I fell in love with you because of a million tiny things you never knew you were doing.",
            "You're the closest to heaven that I'll ever be.",
            "My soul and your soul are forever tangled.",
            "I want all of my lasts to be with you.",
            "You are my sun, my moon, and all my stars.",
            "In a sea of people, my eyes will always search for you.",
            "I love you more than I have ever found a way to say to you.",
            "You make me want to be a better person.",
            "Forever is a long time, but I wouldn't mind spending it by your side.",
            "You're my favorite notification.",
            "I love you begins by I, but it ends up by you.",
            "When I tell you I love you, I don't say it out of habit. I say it to remind you that you're the best thing that ever happened to me.",
            "You are the finest, loveliest, tenderest person I have ever known.",
            "I'm much more me when I'm with you.",
            "You're the reason I look down at my phone and smile, then walk into a pole.",
            "You are my paradise and I would happily get stranded on you for a lifetime.",
            "I swear I couldn't love you more than I do right now, and yet I know I will tomorrow.",
            "My heart is perfect because you are inside.",
            "I would rather spend one lifetime with you, than face all the ages of this world alone.",
            "You are my heart, my life, my one and only thought.",
            "Whatever our souls are made of, yours and mine are the same.",
            "I love you, and that's the beginning and end of everything.",
            "In all the world, there is no heart for me like yours.",
            "You are the last thought in my mind before I drift off to sleep and the first thought when I wake up."
        ];

        // Get random quote on page load
        function displayRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('quote').textContent = quotes[randomIndex];
        }

        // Countdown timer
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                document.querySelector('.countdown-grid').innerHTML = 
                    '<div style="grid-column: 1/-1; font-size: 2.5rem; padding: 40px;">🎉 We\'re Married! 🎉</div>';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        // Initialize
        displayRandomQuote();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
