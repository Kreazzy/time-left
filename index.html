<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waqar & Saher — Together Forever</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;900&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rose:    #e8a0b0;
            --rose-deep: #c96a85;
            --gold:    #d4aa70;
            --gold-light: #f0d5a0;
            --cream:   #fdf6ee;
            --ink:     #2a1a1f;
            --glass:   rgba(255,255,255,0.07);
            --glass-border: rgba(255,255,255,0.18);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background: #0d0608;
            color: var(--cream);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ── VIDEO BG ── */
        #video-bg {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.35) saturate(0.8);
        }

        /* ── PARTICLE CANVAS ── */
        #particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ── OVERLAY GRADIENT ── */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background:
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(201,106,133,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 70% 50% at 80% 20%, rgba(212,170,112,0.15) 0%, transparent 70%),
                linear-gradient(180deg, rgba(13,6,8,0.4) 0%, rgba(13,6,8,0.1) 50%, rgba(13,6,8,0.6) 100%);
            pointer-events: none;
        }

        /* ── LAYOUT ── */
        .page {
            position: relative;
            z-index: 3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(24px, 5vw, 60px) clamp(16px, 4vw, 40px);
            gap: clamp(28px, 5vw, 48px);
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            animation: riseIn 1.2s cubic-bezier(.22,1,.36,1) both;
        }

        .header-eyebrow {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.6rem, 1.8vw, 0.85rem);
            letter-spacing: 0.35em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: clamp(10px, 2vw, 18px);
            opacity: 0.9;
        }

        .names-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 3vw, 28px);
            flex-wrap: wrap;
        }

        .name {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(2.4rem, 9vw, 6rem);
            line-height: 1;
            letter-spacing: 0.06em;
        }

        .name-waqar { color: #a8d8f0; text-shadow: 0 0 40px rgba(168,216,240,0.5), 0 0 80px rgba(168,216,240,0.2); }
        .name-saher { color: var(--rose); text-shadow: 0 0 40px rgba(232,160,176,0.5), 0 0 80px rgba(232,160,176,0.2); }

        .amp {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 7vw, 5rem);
            color: var(--gold);
            text-shadow: 0 0 30px rgba(212,170,112,0.6);
            animation: heartbeat 2.4s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%,100% { transform: scale(1); }
            14%      { transform: scale(1.08); }
            28%      { transform: scale(1); }
            42%      { transform: scale(1.05); }
            56%      { transform: scale(1); }
        }

        .header-tagline {
            margin-top: clamp(10px, 2vw, 18px);
            font-style: italic;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: 300;
            color: var(--gold-light);
            opacity: 0.85;
            letter-spacing: 0.05em;
        }

        /* ── WEDDING DATE BADGE ── */
        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 8px 24px;
            font-family: 'Cinzel', serif;
            font-size: clamp(0.65rem, 1.8vw, 0.8rem);
            letter-spacing: 0.25em;
            color: var(--gold);
            backdrop-filter: blur(12px);
            animation: riseIn 1.4s cubic-bezier(.22,1,.36,1) 0.2s both;
        }

        .date-badge span { opacity: 0.5; }

        /* ── TOGETHER SINCE COUNTER ── */
        .counter-card {
            width: 100%;
            max-width: 820px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: clamp(28px, 5vw, 52px) clamp(20px, 4vw, 48px);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: riseIn 1.2s cubic-bezier(.22,1,.36,1) 0.3s both;
        }

        .counter-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(201,106,133,0.08) 0%, rgba(212,170,112,0.06) 50%, rgba(168,216,240,0.08) 100%);
            pointer-events: none;
        }

        .counter-label {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.6rem, 1.6vw, 0.78rem);
            letter-spacing: 0.3em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: clamp(20px, 3vw, 32px);
        }

        .counter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(10px, 2vw, 20px);
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .time-val {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            line-height: 1;
            background: linear-gradient(160deg, #fff 30%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.15s;
        }

        .time-val.bump {
            animation: bump 0.25s ease;
        }

        @keyframes bump {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .time-name {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.5rem, 1.3vw, 0.7rem);
            letter-spacing: 0.3em;
            color: var(--rose);
            text-transform: uppercase;
        }

        .time-divider {
            font-size: clamp(1.8rem, 4vw, 3rem);
            color: var(--gold);
            opacity: 0.3;
            align-self: center;
            line-height: 1;
            padding-bottom: 8px;
        }

        /* Also show total seconds in a sub row */
        .total-seconds {
            margin-top: clamp(16px, 3vw, 28px);
            font-size: clamp(0.75rem, 1.8vw, 0.95rem);
            color: var(--gold-light);
            opacity: 0.7;
            font-style: italic;
            letter-spacing: 0.04em;
        }

        /* ── QUOTE SECTION ── */
        .quote-section {
            width: 100%;
            max-width: 720px;
            animation: riseIn 1.2s cubic-bezier(.22,1,.36,1) 0.5s both;
        }

        .quote-card {
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: clamp(24px, 4vw, 44px) clamp(24px, 5vw, 52px);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.4s;
        }

        .quote-card:hover { border-color: rgba(232,160,176,0.4); }

        .quote-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(201,106,133,0.06), rgba(168,216,240,0.04));
            pointer-events: none;
        }

        .big-quote {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 8vw, 5rem);
            color: var(--rose);
            opacity: 0.2;
            line-height: 1;
            position: absolute;
            top: 10px;
            left: 20px;
        }

        .quote-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.05rem, 2.6vw, 1.45rem);
            font-style: italic;
            font-weight: 300;
            line-height: 1.85;
            text-align: center;
            position: relative;
            z-index: 1;
            color: #f5ece8;
            transition: opacity 0.4s;
        }

        .quote-hint {
            text-align: center;
            margin-top: 14px;
            font-size: clamp(0.6rem, 1.4vw, 0.72rem);
            letter-spacing: 0.2em;
            color: var(--gold);
            opacity: 0.5;
            text-transform: uppercase;
        }

        /* ── FOOTER HEARTS ── */
        .footer-row {
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0.5;
            animation: riseIn 1.2s cubic-bezier(.22,1,.36,1) 0.7s both;
        }

        .footer-row span { font-size: 1.1rem; animation: heartbeat 2.4s ease-in-out infinite; }
        .footer-row p {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.55rem, 1.4vw, 0.7rem);
            letter-spacing: 0.3em;
            color: var(--gold);
            text-transform: uppercase;
        }

        /* ── ANIMATIONS ── */
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 520px) {
            .counter-grid { grid-template-columns: repeat(2, 1fr); }
            .time-divider { display: none; }
            .names-row { gap: 8px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<video autoplay muted loop playsinline id="video-bg">
    <source src="https://cdn.pixabay.com/video/2023/03/01/152798-803733100_large.mp4" type="video/mp4">
</video>

<canvas id="particles"></canvas>
<div class="overlay"></div>

<main class="page">

    <!-- HEADER -->
    <header class="header">
        <p class="header-eyebrow">A Love Story For The Ages</p>
        <div class="names-row">
            <span class="name name-waqar">WAQAR</span>
            <span class="amp">&amp;</span>
            <span class="name name-saher">SAHER</span>
        </div>
        <p class="header-tagline">Together forever — no countdown needed</p>
    </header>

    <!-- DATE BADGE -->
    <div class="date-badge">
        <span>♡</span>
        Married on 22 March 2026
        <span>♡</span>
    </div>

    <!-- TIME TOGETHER COUNTER -->
    <div class="counter-card">
        <p class="counter-label">We have been together for</p>
        <div class="counter-grid">
            <div class="time-unit">
                <span class="time-val" id="t-days">0</span>
                <span class="time-name">Days</span>
            </div>
            <div class="time-unit">
                <span class="time-val" id="t-hours">00</span>
                <span class="time-name">Hours</span>
            </div>
            <div class="time-unit">
                <span class="time-val" id="t-mins">00</span>
                <span class="time-name">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="time-val" id="t-secs">00</span>
                <span class="time-name">Seconds</span>
            </div>
        </div>
        <p class="total-seconds" id="total-seconds"></p>
    </div>

    <!-- QUOTE -->
    <section class="quote-section">
        <div class="quote-card" onclick="nextQuote()" title="Tap for a new quote">
            <div class="big-quote">"</div>
            <p class="quote-text" id="quote-text"></p>
        </div>
        <p class="quote-hint">✦ tap for a new love line ✦</p>
    </section>

    <!-- FOOTER -->
    <div class="footer-row">
        <span>♡</span>
        <p>Always & Forever</p>
        <span>♡</span>
    </div>

</main>

<script>
/* ── QUOTES — 110 love lines ── */
const quotes = [
    "In you, I've found the love of my life and my closest, truest friend.",

    "You are the poem I never knew how to write and this life is the story I have always wanted to tell.",

    "Every moment spent with you is worth a thousand with anyone else.",
    "You are the reason I believe in magic.",
    "With you, every ordinary moment feels extraordinary.",
    "You complete me in ways I didn't know I was missing.",
    "I love the way your hand fits perfectly in mine.",
    "You are my shelter from every storm.",
    "To love you is the easiest thing I have ever done.",
    "My love for you has no beginning and no end — it is a circle.",
    "You are everything I never knew I always wanted.",
    "I am undone by the thought of you and remade with each glance.",
    "Growing old with you is my greatest wish.",
    "You turned my world from black and white into every shade of color.",
    "You are the music I hear when no song is playing.",

    "You are not just my love; you are my best friend, my safe place, my whole world.",
    "Every love story is unique, but ours is my absolute favorite chapter of my life.",
    "I don't need paradise because I found you.",

    "Loving you is the most natural thing I have ever done.",

    "I love you in the morning, in the middle of the day, in the hours we are together, and the hours we are apart.",
    "Every star in the sky is a reason I love you — and there are not enough stars.",
    "You are the only person who can make my heart race and put it at ease at the same time.",
    "I have found the one my soul loves.",
    "There is no one else I would rather build a life with than you.",
    "You are my serenity in the chaos of the world.",
    "I love you not just for who you are but for who I become when I'm with you.",
    "A thousand lifetimes with you would never be enough.",
    "You are my greatest treasure, my deepest joy, my loudest laughter, my softest comfort.",
    "Where you go, my heart goes.",
    "I love you to the moon and back — and then some.",
    "You are the best thing that has ever been mine.",
    "Our love is the kind that songs are written about.",
    "You are my person — always, entirely, endlessly.",
    "No distance, no time, no force in this universe could dim what I feel for you.",
    "I love you today more than yesterday, and tomorrow more than today.",
    "With you beside me, I have everything I will ever need.",
    "You are the love of my life and I choose you every single day."
];

let quoteIndex = Math.floor(Math.random() * quotes.length);

function showQuote(idx) {
    const el = document.getElementById('quote-text');
    el.style.opacity = 0;
    setTimeout(() => {
        el.textContent = quotes[idx % quotes.length];
        el.style.opacity = 1;
    }, 300);
}

function nextQuote() {
    quoteIndex = (quoteIndex + 1) % quotes.length;
    showQuote(quoteIndex);
}

showQuote(quoteIndex);

/* ── COUNTER ── */
const START = new Date('2026-03-22T00:00:00').getTime();

function pad(n) { return String(n).padStart(2, '0'); }

function updateCounter() {
    const elapsed = Date.now() - START;
    if (elapsed < 0) return;

    const totalSeconds = Math.floor(elapsed / 1000);
    const secs  = totalSeconds % 60;
    const mins  = Math.floor(totalSeconds / 60) % 60;
    const hours = Math.floor(totalSeconds / 3600) % 24;
    const days  = Math.floor(totalSeconds / 86400);

    const setVal = (id, val) => {
        const el = document.getElementById(id);
        if (el.textContent !== String(val)) {
            el.textContent = val;
            el.classList.remove('bump');
            void el.offsetWidth; // reflow
            el.classList.add('bump');
        }
    };

    setVal('t-days',  days);
    setVal('t-hours', pad(hours));
    setVal('t-mins',  pad(mins));
    setVal('t-secs',  pad(secs));

    document.getElementById('total-seconds').textContent =
        `${totalSeconds.toLocaleString()} beautiful seconds and counting…`;
}

updateCounter();
setInterval(updateCounter, 1000);

/* ── PARTICLES ── */
(function initParticles() {
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, particles;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    const SYMBOLS = ['♡', '✦', '✧', '·'];

    function spawn() {
        return {
            x: Math.random() * W,
            y: H + 20,
            sym: SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
            size: Math.random() * 10 + 6,
            speed: Math.random() * 0.6 + 0.2,
            opacity: Math.random() * 0.35 + 0.05,
            drift: (Math.random() - 0.5) * 0.4,
            color: Math.random() > 0.5 ? '#e8a0b0' : '#d4aa70'
        };
    }

    function init() {
        resize();
        particles = Array.from({ length: 55 }, () => {
            const p = spawn();
            p.y = Math.random() * H;
            return p;
        });
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => {
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = p.color;
            ctx.font = `${p.size}px serif`;
            ctx.fillText(p.sym, p.x, p.y);

            p.y -= p.speed;
            p.x += p.drift;

            if (p.y < -20) Object.assign(p, spawn(), { x: Math.random() * W });
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); });
    init();
    draw();
})();
</script>
</body>
</html>
